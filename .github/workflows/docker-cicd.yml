name: Docker CI/CD Pipeline with Compose

on:
  push:
    branches:
      - feature/ahmadbutt

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-backend:run-${{ github.run_number }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-frontend:run-${{ github.run_number }}

      - name: Build and push admin
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-admin:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-admin:run-${{ github.run_number }}

      - name: Remove local Docker images to save disk space
        run: |
          docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-backend:latest || true
          docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-backend:run-${{ github.run_number }} || true
          docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-frontend:latest || true
          docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-frontend:run-${{ github.run_number }} || true
          docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-admin:latest || true
          docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-admin:run-${{ github.run_number }} || true

      - name: Pull and run containers manually (docker run verification)
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-backend:latest
          docker run -d --name verify-backend -p 4000:4000 \
            -e MONGO_URL=mongodb://mongodb:27017/food-delivery \
            -e JWT_SECRET=testsecret \
            -e SALT=10 \
            ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-backend:latest
          sleep 5
          docker ps
          docker logs verify-backend
          docker stop verify-backend
          docker rm verify-backend

      - name: Deploy full stack with Docker Compose
        run: |
          docker compose -f docker-compose.hub.yml pull
          docker compose -f docker-compose.hub.yml up -d
          sleep 10
          docker compose -f docker-compose.hub.yml ps

      - name: Verify backend responds
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:4000/api/food/list; then
              echo "Backend is up and responding"
              exit 0
            fi
            echo "Waiting for backend... attempt $i"
            sleep 3
          done
          echo "Backend did not respond in time"
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.hub.yml down 
