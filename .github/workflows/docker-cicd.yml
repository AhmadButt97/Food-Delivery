name: Docker CI/CD Pipeline with Compose

on:
  push:
    branches:
      - feature/ahmadbutt

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-backend:run-${{ github.run_number }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-frontend:run-${{ github.run_number }}

      - name: Build and push admin
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-admin:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-admin:run-${{ github.run_number }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest images and deploy
        run: |
          docker compose -f docker-compose.hub.yml pull
          docker compose -f docker-compose.hub.yml up -d

      - name: Verify backend responds
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:4000/api/food/list; then
              echo "Backend is up and responding"
              exit 0
            fi
            echo "Waiting for backend... attempt $i"
            sleep 3
          done
          echo "Backend did not respond in time"
          exit 1 
