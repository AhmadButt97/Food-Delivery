services:
  mongodb:
    image: mongo:8.0-noble
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    image: ahmadbutt97/food-delivery-backend:latest
    container_name: tomato-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    image: ahmadbutt97/food-delivery-frontend:latest
    container_name: tomato-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    image: ahmadbutt97/food-delivery-admin:latest
    container_name: tomato-admin
    ports:
      - "5174:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
