namespace: food-delivery
backend:
  image: ahmadbutt97/food-delivery-backend
  tag: run-26
  replicas: 1
  port: 4000
  hpa:
    minReplicas: 1
    maxReplicas: 1
    targetCPUPercent: 90
  secrets:
    jwtSecret: "mysecretkey123"
    salt: "10"
  env:
    mongoUrl: "mongodb://mongodb:27017/food-delivery"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
frontend:
  image: ahmadbutt97/food-delivery-frontend
  tag: run-26
  replicas: 3
  port: 5173
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "150m"
      memory: "128Mi"
mongodb:
  image: mongo
  tag: latest
  storageSize: 2Gi
  storageClassName: local-path
  wiredTigerCacheSizeGB: "0.25"
  resources:
    requests:
      cpu: "100m"
      memory: "200Mi"
    limits:
      cpu: "300m"
      memory: "350Mi"
